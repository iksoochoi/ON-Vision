<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;560;680&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/live.css">
</head>
<body>
<script src="/js/welcome.js"></script>
  <div class="topbar">
    <a class="brand-mark" href="/" aria-label="Go to home"><svg width="54" height="54" viewBox="0 0 54 54" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M36.281 11.384c-.056.058-.114.13-.17.188l-2.364 2.41-.057.058c-.057.072-.057.145.014.247a8.331 8.331 0 0 1 1.096 3.309c.257 2.409-.342 4.571-1.822 6.473-1.268 1.625-2.92 2.64-4.899 3.09-.911.204-1.837.218-2.762.117-1.524-.16-2.891-.726-4.116-1.655-1.766-1.335-2.862-3.105-3.318-5.311-.17-.813-.199-1.64-.128-2.453.171-1.901.883-3.585 2.15-5.022 1.21-1.379 2.692-2.278 4.443-2.685a8.03 8.03 0 0 1 2.635-.189 8.5 8.5 0 0 1 3.588 1.147c.142.087.2.029.285-.058l2.35-2.395c.056-.058.113-.13.185-.217l2.889 2.945.001.001Zm-5.342 7.4c.071-2.8-2.093-4.832-4.529-4.905-2.748-.073-4.798 2.25-4.798 4.76 0 2.57 2.122 4.79 4.67 4.746 2.507.03 4.6-2.076 4.656-4.6Zm3.605 19.391c.014 2.351 0 4.717 0 7.068v.32h-4.13v-.29c0-2.468.015-4.935 0-7.403 0-1.291-.44-2.423-1.366-3.323a3.827 3.827 0 0 0-2.208-1.06c-1.11-.16-2.121.117-3.018.799-.898.696-1.424 1.64-1.595 2.757-.086.537-.1 1.089-.1 1.64-.014 2.192 0 4.369 0 6.56v.305h-4.101v-.276c0-2.656-.029-5.326.014-7.982.029-1.408.47-2.743 1.196-3.962 1.21-2.032 2.934-3.338 5.198-3.875a8.414 8.414 0 0 1 2.178-.203c2.265.101 4.201 1.015 5.74 2.742 1.096 1.248 1.794 2.7 2.036 4.369.098.608.155 1.217.155 1.812"/></svg></a>
    <h1 id="pageTitle">Data Collector</h1>
    <button type="button" id="navToggle" class="secondary" aria-controls="sidenav" aria-expanded="false" aria-label="Expand menu" title="Expand menu"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="spacer"></div>
    <button id="panelToggle" class="secondary" aria-controls="panel" aria-expanded="false" aria-label="Open controls" title="Open controls"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M15 4.5v15" stroke="currentColor" stroke-width="1.6"/><path class="pane" d="M15.8 6.2H19a1 1 0 0 1 1 1V16.8a1 1 0 0 1-1 1h-3.2V6.2Z" fill="currentColor"/></svg></button>
  </div>
  <nav class="sidenav" id="sidenav" aria-label="Pages">
    <a href="/" class="current"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 12h2l1.2-2.2L13 15l1.2-3H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Live</span></a>
    <!-- Label menu is hidden. Uncomment the next line to show it.
    <a href="/label"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 12.5V5.5h7l8 8-7 7-8-8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8.5" cy="9" r="1.1" fill="currentColor"/></svg><span>Label <span class="chip warn" id="unlabeledChip">0</span></span></a>
    -->
    <a href="/browse"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg><span>Browse</span></a>
    <a href="/qr"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h6v6H4V4zm1.6 1.6v2.8h2.8V5.6H5.6zM14 4h6v6h-6V4zm1.6 1.6v2.8h2.8V5.6h-2.8zM4 14h6v6H4v-6zm1.6 1.6v2.8h2.8v-2.8H5.6zM14 14h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm2-2h2v2h-2zm2 2h2v2h-2z"/></svg><span>QR</span></a>
    <a href="/predict"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5l7 3v5c0 4.2-2.9 7.6-7 9.5-4.1-1.9-7-5.3-7-9.5v-5l7-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2.2 2.2L15.2 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Predict</span></a>
  </nav>
  <div class="tabbar">
    <span class="tabbar-title">Live</span>
    <div class="tabbar-status">
      <span class="chip" id="shotsChip">Shots -</span>
      <span class="chip" id="camChip">Cameras -</span>
      <span class="chip" id="detectorChip">Detect: -</span>
    </div>
  </div>
  <div class="live">
    <main class="live-main">
      <!-- <div class="hint">Green box = capture target. Yellow crosshair = frame center. Click the live view to focus that camera and lock the focus. The small pictures are the latest captured set. Click one to enlarge it.</div>
      <div class="hint" id="status">Waiting</div>
      <div class="capbar" id="capBar">No captures yet</div> -->
      <div class="tiles" id="tiles"></div>
    </main>
    <aside class="panel" id="panel" aria-label="Controls">
      <div class="panel-head">
        <b>Controls</b>
        <button id="panelClose" class="secondary" title="Close">✕</button>
      </div>
      <div class="card">
        <h3>Capture</h3>
        <div class="capture-line">
          <span>Auto capture</span>
          <label class="switch" title="Auto capture">
            <input type="checkbox" id="autoBtn" aria-label="Auto capture">
            <span></span>
          </label>
        </div>
        <div class="capture-line">
          <span>Manual capture</span>
          <button type="button" id="nowBtn" class="secondary iconbtn" aria-label="Manual capture" title="Manual capture"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8.5h3l1.2-2h7.6l1.2 2H20a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18v-8A1.5 1.5 0 0 1 4 8.5z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13.8" r="2.8" stroke="currentColor" stroke-width="1.6"/></svg></button>
        </div>
        <div class="hint" id="autoInfo"></div>
      </div>
      <div class="card">
        <h3>Cameras</h3>
        <div class="row">
          <button id="streamAllOn" class="secondary">All streams on</button>
          <button id="streamAllOff" class="secondary">All off</button>
        </div>
        <!-- <div class="hint">◉ = reference camera for background removal (shoe detection) and capture. Changing resolution or the reference restarts that camera.</div> -->
        <div id="camList"></div>
      </div>
      <!-- <div class="card" id="bgCard">
        <h3>Reference background</h3>
        <div class="row">
          <button id="bgBtn" class="secondary">Capture background</button>
          <span class="chip" id="bgChip">-</span>
        </div>
      </div> -->
      <div class="card">
        <div class="card-head">
          <h3>Camera</h3>
          <button type="button" id="camReset" class="secondary iconbtn" aria-label="Reset camera settings" title="Reset to defaults"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4.5V9h-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="slider-row" id="camTargetRow" hidden>
          <label for="camTarget">Apply to</label>
          <select id="camTarget"></select>
          <span></span>
        </div>
        <div id="camControls"></div>
        <!-- <div class="hint">To reduce blur, keep <b>AE limit</b> short (for example 2ms). Make up brightness with ISO.
          Shorter than 10ms requires <b>Flicker</b> set to Off, and AC lighting may show brightness bands.
          <b>Focus (lens)</b> locks to the value set by clicking the picture, and is saved. 0 keeps continuous autofocus.
          All values persist across restarts.
        </div> -->
      </div>
    </aside>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="confirm" id="confirmOff" hidden>
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmOffTitle">
      <h2 id="confirmOffTitle">Turn off all streams?</h2>
      <p>Live views stop until you turn the streams back on.</p>
      <div class="confirm-actions">
        <button type="button" id="confirmOffCancel" class="secondary">Cancel</button>
        <button type="button" id="confirmOffOk">Turn off</button>
      </div>
    </div>
  </div>
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-bar">
      <span id="lbCaption"></span>
      <a id="lbLink" class="linkbtn" href="#">Open in browse</a>
      <button id="lbClose" class="secondary">Close (Esc)</button>
    </div>
    <img id="lbImg" alt="">
  </div>
<script>
(function () {
  var btn = document.getElementById('navToggle');
  var open = false;
  function setNav(next) {
    open = next;
    document.body.classList.toggle('nav-open', open);
    btn.setAttribute('aria-expanded', String(open));
    var label = open ? 'Collapse menu' : 'Expand menu';
    btn.setAttribute('aria-label', label);
    btn.title = label;
  }
  btn.onclick = function () { setNav(!open); };
})();
</script>
<script src="/js/live.js"></script>
</body>
</html>
